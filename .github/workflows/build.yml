on: [push, pull_request]
name: Build
jobs:
  linux:
    name: ${{ matrix.driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - driver: gtk3
          deps: libgtk-3-dev
        - driver: gtk4
          deps: libgtk-4-dev
        - driver: gtk2
          deps: libgtk2.0-dev
        - driver: qt6
          deps: qt6-base-dev
        - driver: qt5
          deps: qtbase5-dev
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Checkout IUP
      uses: actions/checkout@v4
      with:
        repository: gen2brain/iup-go
        path: iup-go
    - name: Install dependencies
      run: sudo apt-get update -y && sudo apt-get install -y cmake pkg-config ${{ matrix.deps }}
    - name: Build IUP
      run: |
        cmake --preset ${{ matrix.driver }}
        cmake --build build/${{ matrix.driver }} --parallel
        cmake --install build/${{ matrix.driver }} --prefix $HOME/iup
      working-directory: iup-go/iup/external
    - name: Build
      run: |
        export PKG_CONFIG_PATH=$(dirname $(find $HOME/iup -name iup.pc | head -1))
        ./configure --prefix=/usr --sysconfdir=/etc --with-iup-static
        make
        make install DESTDIR=$PWD/destdir
